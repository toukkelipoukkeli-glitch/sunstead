# Self-hosted Supabase CORE (auth + data API) — the stack that runs on Aiven Apps,
# on top of Aiven for PostgreSQL. This file runs it LOCALLY to prove it works.
#
# Local:      includes a `db` for testing.
# Aiven Apps: delete the `db` service and set AUTH_DB_URL / REST_DB_URL to your
#             Aiven Postgres connection string. Everything else is identical.
name: supabase-on-aiven

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    ports: ["54322:5432"]
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  auth:
    image: supabase/gotrue:v2.151.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: ${AUTH_DB_URL:-postgres://postgres:postgres@db:5432/postgres}
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: "*"
      API_EXTERNAL_URL: ${PUBLIC_URL:-http://localhost:8000}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  rest:
    image: postgrest/postgrest:v12.2.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: ${REST_DB_URL:-postgres://authenticator:postgres@db:5432/postgres}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  gateway:
    image: caddy:2-alpine
    depends_on: [auth, rest]
    ports: ["8000:8000"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
